<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Fee Calculator</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    
    <div class="app-container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>VIP料金算出ツール</h1>
                <button id="open-settings-btn" class="icon-btn" aria-label="設定を開く">⚙️設定</button>
            </div>
        </header>

        <main>
            <form id="calculator-form">
                
                <div class="form-group">
                    <label for="store-select">店舗を選択</label>
                    <div class="select-wrapper">
                        <select id="store-select">
                            <!-- JSで動的に追加されます -->
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="people">利用人数 (名)</label>
                    <div class="input-wrapper">
                        <input type="number" id="people" min="1" max="20" value="2" inputmode="numeric" pattern="[0-9]*" required>
                    </div>
                </div>

                <div class="form-group row-group">
                    <div class="half-group">
                        <label for="day-type">曜日</label>
                        <div class="select-wrapper">
                            <select id="day-type">
                                <option value="weekday">平日</option>
                                <option value="weekend">金・土・祝前日</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="half-group">
                        <label for="time-slot">入店時間帯</label>
                        <div class="select-wrapper">
                            <select id="time-slot">
                                <option value="open-20">Open 〜 20:00</option>
                                <option value="20-22">20:00 〜 22:00</option>
                                <option value="22-24">22:00 〜 24:00</option>
                                <option value="24-close">24:00 〜 Close</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="room-grade">VIPルーム種別</label>
                    <div class="select-wrapper">
                        <select id="room-grade">
                            <!-- JSで動的に追加されます -->
                        </select>
                    </div>
                </div>

                <div class="form-group special-plans">
                    <label>特殊プラン</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="plan-1person" disabled>
                        <span id="label-1person">1名様での利用 (60分 5,940円)</span>
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="plan-40s">
                        <span id="label-40s">40代以上限定プラン (60分 5,940円)</span>
                    </label>
                </div>
            </form>

            <div class="result-section">
                <div class="result-label">1名あたりの総額 (税込)</div>
                <div class="result-value">
                    <span class="currency">¥</span>
                    <span id="total-price">0</span>
                </div>
                
                <div class="breakdown">
                    <div class="breakdown-item">
                        <span>VIPルーム割勘</span>
                        <span id="breakdown-room">¥0</span>
                    </div>
                    <div class="breakdown-item">
                        <span>相席料金 (60分)</span>
                        <span id="breakdown-matching">¥0</span>
                    </div>
                    <div class="breakdown-item">
                        <span>チャージ料金 (固定)</span>
                        <span id="breakdown-charge">¥550</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <dialog id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 料金設定の管理</h2>
                <button id="close-settings-btn" class="close-btn">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-store-select">編集する店舗を選択</label>
                    <select id="edit-store-select"></select>
                </div>

                <div class="form-group">
                    <label for="edit-store-name">店舗名</label>
                    <input type="text" id="edit-store-name" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>

                <h3>相席料金 (60分換算)</h3>
                <div class="fee-grid">
                    <div>
                        <h4>平日</h4>
                        <label>Open〜20時 <input type="number" id="fee-wd-1" inputmode="numeric"></label>
                        <label>20時〜22時 <input type="number" id="fee-wd-2" inputmode="numeric"></label>
                        <label>22時〜24時 <input type="number" id="fee-wd-3" inputmode="numeric"></label>
                        <label>24時〜Close <input type="number" id="fee-wd-4" inputmode="numeric"></label>
                    </div>
                    <div>
                        <h4>週末（金土祝前）</h4>
                        <label>Open〜20時 <input type="number" id="fee-we-1" inputmode="numeric"></label>
                        <label>20時〜22時 <input type="number" id="fee-we-2" inputmode="numeric"></label>
                        <label>22時〜24時 <input type="number" id="fee-we-3" inputmode="numeric"></label>
                        <label>24時〜Close <input type="number" id="fee-we-4" inputmode="numeric"></label>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border-color);">
                    <label for="edit-special-fee" style="font-weight: 600; color: var(--text-main);">特殊プラン料金（1名・40代 / 60分）</label>
                    <input type="number" id="edit-special-fee" style="width: 150px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 6px;" inputmode="numeric">
                </div>

                <div class="advanced-settings" open>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="margin: 0;">VIPルーム設定</h3>
                        <button id="add-vip-room-btn" class="btn" style="background-color: #10b981; color: white; padding: 0.25rem 0.75rem; font-size: 0.85rem;">＋ 新規追加</button>
                    </div>
                    
                    <div id="vip-rooms-container">
                        <!-- JSでフォームが生成されます -->
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="reset-settings-btn" class="btn btn-danger">初期設定に戻す</button>
                <button id="save-settings-btn" class="btn btn-primary">保存して反映</button>
            </div>
        </div>
    </dialog>

    <script src="main.js?v=5"></script>
</body>
</html>
